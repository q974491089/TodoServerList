<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- 基础字符集和视口设置 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- 页面标题 - 控制在60字符以内 -->
    <title>To-Do Server List | 任务服务器管理工具</title>

    <!-- 页面描述 - 控制在155-160字符以内，这是搜索结果中显示的摘要 -->
    <meta
      name="description"
      content="To-Do Server List 是一款高效的任务服务器管理工具，帮助您轻松管理、追踪和组织待办事项与服务器任务。支持多平台，界面简洁直观。"
    />

    <!-- 关键词 - 虽然 Google 已不重视，但对部分搜索引擎仍有帮助 -->
    <meta
      name="keywords"
      content="todo, 待办事项, 任务管理, 服务器管理, task manager, server list, 任务列表, 效率工具"
    />

    <!-- 作者信息 -->
    <meta name="author" content="To-Do Server List Team" />

    <!-- 爬虫指令 -->
    <meta name="robots" content="index, follow" />
    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- 规范链接 - 防止重复内容问题 -->
    <link rel="canonical" href="https://todoserverlist.xyls.us.kg/" />

    <!-- 主题色 - 增强移动端浏览器地址栏体验 -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="msapplication-TileColor" content="#3b82f6" />

    <!-- Open Graph 标签 - 优化社交媒体分享 (Facebook, LinkedIn 等) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="To-Do Server List" />
    <meta
      property="og:title"
      content="To-Do Server List | 任务服务器管理工具"
    />
    <meta
      property="og:description"
      content="高效的任务服务器管理工具，帮助您轻松管理、追踪和组织待办事项与服务器任务。"
    />
    <meta property="og:url" content="https://todoserverlist.xyls.us.kg/" />
    <meta
      property="og:image"
      content="https://todoserverlist.xyls.us.kg/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter 卡片标签 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="To-Do Server List | 任务服务器管理工具"
    />
    <meta
      name="twitter:description"
      content="高效的任务服务器管理工具，帮助您轻松管理和组织待办事项与服务器任务。"
    />
    <meta
      name="twitter:image"
      content="https://todoserverlist.xyls.us.kg/og-image.png"
    />

    <!-- 图标 -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/vite.svg" />

    <!-- 预连接优化 - 提升第三方资源加载速度 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD 结构化数据 - 帮助搜索引擎更好理解页面内容 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "To-Do Server List",
        "description": "高效的任务服务器管理工具，帮助您轻松管理、追踪和组织待办事项与服务器任务。",
        "url": "https://todoserverlist.xyls.us.kg/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
